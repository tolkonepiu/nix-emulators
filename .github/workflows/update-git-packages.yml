name: Update git packages

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-git-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@7ab6e7fd29da88e74b1e314a4ae9ac6b5cda3801 # v31.8.0
      - name: Update source manifests without executing upstream code
        run: |
          packages=$(nix eval --json .#packages.x86_64-linux --apply 'packages: builtins.filter (name: (builtins.getAttr name packages) ? updateScript) (builtins.attrNames packages)')
          while IFS= read -r package; do
            nix run ".#${package}.updateScript"
          done < <(printf '%s' "$packages" | jq -r '.[]')
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed updates without building upstream sources
        run: |
          nix flake check --all-systems --no-build
          nix eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/git-packages
          delete-branch: true
          add-paths: pkgs/*/manifest.json
          commit-message: 'chore: update git packages'
          title: 'chore: update git packages'
          body: |
            Updates GitHub source packages discovered through their updateScript passthroughs.
            Each manifest pins the exact source commit and SHA-256 hash, including configured submodules.
            Evaluation of all advertised systems ran before opening this PR.
            With the default GITHUB_TOKEN, PR workflows do not run automatically; run CI manually on this branch before merging for native build coverage, or configure UPDATE_TOKEN to trigger PR CI.
