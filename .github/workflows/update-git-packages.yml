name: Update git packages

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-git-packages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@7ab6e7fd29da88e74b1e314a4ae9ac6b5cda3801 # v31.8.0
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          skipPush: true
      - name: Update source manifests without executing upstream code
        run: |
          packages=$(nix eval --json .#packages.x86_64-linux --apply 'packages: builtins.filter (name: (builtins.getAttr name packages) ? updateScript) (builtins.attrNames packages)')
          while IFS= read -r package; do
            nix run ".#${package}.updateScript"
          done < <(printf '%s' "$packages" | jq -r '.[]')
      - name: Regenerate Ryubing NuGet dependencies
        run: |
          fetch_deps=$(nix build --no-link --print-out-paths .#ryubing-git.fetch-deps)
          "$fetch_deps" "$PWD/pkgs/ryubing-git/deps.json"
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed updates
        run: |
          nix flake check --all-systems --no-build
          nix eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
          nix build --no-link .#ryubing-git
      - name: Stage only source manifests and NuGet pins
        run: |
          mkdir -p "$RUNNER_TEMP/git-package-updates"
          cp --parents pkgs/*/manifest.json pkgs/ryubing-git/deps.json "$RUNNER_TEMP/git-package-updates/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-package-updates
          # The staging directory contents retain the explicit pkgs/ prefix.
          path: ${{ runner.temp }}/git-package-updates/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git-package-updates
          path: ${{ runner.temp }}/git-package-updates
      - name: Validate and apply data-only updates
        run: python3 scripts/apply-git-package-updates.py "$RUNNER_TEMP/git-package-updates"
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/git-packages
          delete-branch: true
          add-paths: |
            pkgs/*/manifest.json
            pkgs/ryubing-git/deps.json
          commit-message: 'chore: update git packages'
          title: 'chore: update git packages'
          body: |
            Updates Git source packages discovered through their updateScript passthroughs.
            Each manifest pins the exact source commit and SHA-256 hash, including configured submodules.
            Ryubing NuGet dependencies were regenerated and its native Linux build passed in an unprivileged job.
            Evaluation of all advertised systems ran before opening this PR; only validated JSON pins were transferred to this publishing job.
            With the default GITHUB_TOKEN, PR workflows do not run automatically; run CI manually on this branch before merging for native build coverage, or configure UPDATE_TOKEN to trigger PR CI.
