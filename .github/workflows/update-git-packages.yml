name: Update git packages

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-git-packages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          skipPush: true
      # Dependency restore may execute upstream code; this job has no secrets or write permissions.
      - name: Update source manifests and optional NuGet dependencies
        run: |
          packages=$(nix --accept-flake-config eval --json .#packages.x86_64-linux --apply 'packages: builtins.filter (name: (builtins.getAttr name packages) ? updateScript) (builtins.attrNames packages)')
          while IFS= read -r package; do
            nix --accept-flake-config run ".#${package}.updateScript"
            deps="pkgs/${package}/deps.json"
            if [ -f "$deps" ]; then
              fetch_deps=$(nix --accept-flake-config build --no-link --print-out-paths ".#${package}.fetch-deps")
              "$fetch_deps" "$PWD/$deps"
            fi
          done < <(printf '%s' "$packages" | jq -r '.[]')
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed updates
        run: |
          nix --accept-flake-config flake check --all-systems --no-build
          nix --accept-flake-config eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
          nix --accept-flake-config build --no-link --impure --expr 'let flake = builtins.getFlake (toString ./.); in builtins.filter (package: package ? updateScript) (builtins.attrValues (builtins.getAttr builtins.currentSystem flake.packages))'
      - name: Stage only source manifests and NuGet pins
        run: |
          mkdir -p "$RUNNER_TEMP/git-package-updates"
          shopt -s nullglob
          cp --parents pkgs/*/manifest.json pkgs/*/deps.json "$RUNNER_TEMP/git-package-updates/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-package-updates
          # The staging directory contents retain the explicit pkgs/ prefix.
          path: ${{ runner.temp }}/git-package-updates/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git-package-updates
          path: ${{ runner.temp }}/git-package-updates
      - name: Validate and apply data-only updates
        run: python3 scripts/apply-git-package-updates.py "$RUNNER_TEMP/git-package-updates"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/git-packages
          delete-branch: true
          add-paths: |
            pkgs/*/manifest.json
            pkgs/*/deps.json
          commit-message: 'chore: update git packages'
          title: 'chore: update git packages'
