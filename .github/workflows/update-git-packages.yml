name: Update git packages

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-git-packages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Discover packages with updaters
        id: discover
        run: |
          packages=$(nix --accept-flake-config eval --json .#packages.x86_64-linux --apply 'packages: builtins.filter (name: name != "default" && (let package = builtins.getAttr name packages; in package ? updateScript || package ? fetch-deps)) (builtins.attrNames packages)')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    uses: ./.github/workflows/update-git-package.yml
    with:
      package: ${{ matrix.package }}
    secrets:
      UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
