name: Update git package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          skipPush: true
      # Dependency restore may execute upstream code; this job has no secrets or write permissions.
      - name: Update source manifest and optional dependencies
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          has_source_update=$(nix --accept-flake-config eval --json ".#${PACKAGE}" --apply 'package: package ? updateScript')
          if [ "$has_source_update" = true ]; then
            nix --accept-flake-config run ".#${PACKAGE}.updateScript"
          fi
          has_dependency_update=$(nix --accept-flake-config eval --json ".#${PACKAGE}" --apply 'package: package ? fetch-deps')
          if [ "$has_dependency_update" = true ]; then
            fetch_deps=$(nix --accept-flake-config build --no-link --print-out-paths ".#${PACKAGE}.fetch-deps")
            "$fetch_deps" "$PWD/pkgs/$PACKAGE/deps.json"
          fi
      - name: Validate proposed update without building emulators
        run: |
          nix --accept-flake-config flake check --all-systems --no-build
          nix --accept-flake-config eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - name: Stage selected package directory
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-package-updates/$PACKAGE"
          cp -a --parents "pkgs/$PACKAGE" "$RUNNER_TEMP/git-package-updates/$PACKAGE/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-package-updates-${{ inputs.package }}
          path: ${{ runner.temp }}/git-package-updates/${{ inputs.package }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: git-package-updates-${{ inputs.package }}
          path: ${{ runner.temp }}/git-package-updates/${{ inputs.package }}
      - name: Validate and apply package-local updates
        id: apply
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 scripts/apply-git-package-updates.py "$RUNNER_TEMP/git-package-updates/$PACKAGE" "$PACKAGE"
          {
            echo 'add-paths<<EOF'
            echo "pkgs/$PACKAGE"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Resolve App bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          login="${APP_SLUG}[bot]"
          id=$(gh api "users/$login" --jq .id)
          echo "identity=$login <$id+$login@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: pr
        with:
          token: ${{ steps.app.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          branch: automation/${{ inputs.package }}
          delete-branch: true
          add-paths: ${{ steps.apply.outputs.add-paths }}
          commit-message: 'chore: update ${{ inputs.package }}'
          title: 'chore: update ${{ inputs.package }}'
      - name: Enable auto-merge
        if: >-
          steps.pr.outputs.pull-request-number != '' &&
          contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
