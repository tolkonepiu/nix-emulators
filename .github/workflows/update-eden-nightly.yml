name: Update Eden nightly

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rehash the current tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-eden-nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Hash release downloads (never execute them)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ]; then
            python3 scripts/update-eden-nightly.py --force
          else
            python3 scripts/update-eden-nightly.py
          fi
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed update without running upstream artifacts
        run: |
          nix --accept-flake-config flake check --all-systems --no-build
          nix --accept-flake-config eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/eden-nightly
          delete-branch: true
          add-paths: pkgs/eden-nightly-bin/sources.json
          commit-message: 'chore: update Eden nightly binaries'
          title: 'chore: update Eden nightly binaries'
