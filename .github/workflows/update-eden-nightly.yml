name: Update Eden nightly

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rehash the current tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-eden-nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@7ab6e7fd29da88e74b1e314a4ae9ac6b5cda3801 # v31.8.0
      - name: Hash release downloads (never execute them)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ]; then
            python3 scripts/update-eden-nightly.py --force
          else
            python3 scripts/update-eden-nightly.py
          fi
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed update without running upstream artifacts
        run: |
          nix flake check --all-systems --no-build
          nix eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/eden-nightly
          delete-branch: true
          add-paths: pkgs/eden-nightly-bin/sources.json
          commit-message: 'chore: update Eden nightly binaries'
          title: 'chore: update Eden nightly binaries'
          body: |
            Pins the complete latest nightly release with SHA-256 hashes of raw downloads.
            Evaluation of all advertised systems ran before opening this PR.
            With the default GITHUB_TOKEN, PR workflows do not run automatically; run CI manually on this branch before merging for native build coverage, or configure UPDATE_TOKEN to trigger PR CI.
