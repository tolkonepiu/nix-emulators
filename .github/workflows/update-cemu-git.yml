name: Update Cemu git

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cemu-git
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@7ab6e7fd29da88e74b1e314a4ae9ac6b5cda3801 # v31.8.0
      - name: Update Cemu source pin
        run: nix flake update cemu-src
      # GITHUB_TOKEN-created PRs do not trigger CI; validate here as well.
      - name: Validate proposed update without building upstream sources
        run: |
          python3 -m unittest discover -s tests -v
          nix flake check --all-systems --no-build
          nix eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/cemu-git
          delete-branch: true
          add-paths: flake.lock
          commit-message: 'chore: update Cemu git'
          title: 'chore: update Cemu git'
          body: |
            Updates only the cemu-src input tracking upstream Cemu main.
            flake.lock pins the exact source commit, even when its source date is unchanged.
            Unit tests and evaluation of all advertised systems ran before opening this PR.
            With the default GITHUB_TOKEN, PR workflows do not run automatically; run CI manually on this branch before merging for native build coverage, or configure UPDATE_TOKEN to trigger PR CI.
