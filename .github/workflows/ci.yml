name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@7ab6e7fd29da88e74b1e314a4ae9ac6b5cda3801 # v31.8.0
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          # PRs can run upstream code before review; only trusted main builds upload.
          authToken: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Check and evaluate every advertised system
        run: |
          nix flake check --all-systems --no-build
          nix eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - name: Build every native package
        run: |
          # shellcheck disable=SC2016 # Interpolation belongs to Nix, not the shell.
          nix build --no-link --print-build-logs --impure --expr \
            'let flake = builtins.getFlake (toString ./.); in builtins.attrValues flake.packages.${builtins.currentSystem}'
      - name: Check launchers without a display
        run: |
          nix run .#cemu-git -- --version
          nix run .#ryubing-git -- --no-gui --version
