name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          skipPush: true
      - name: Check and evaluate every advertised system
        run: |
          nix --accept-flake-config flake check --all-systems --no-build
          nix --accept-flake-config eval --json .#packages --apply 'builtins.mapAttrs (_: builtins.mapAttrs (_: package: package.drvPath))'
      - name: Select changed native packages
        id: select
        run: |
          nix --accept-flake-config eval --json .#packages --apply \
            'builtins.mapAttrs (_: builtins.mapAttrs (_: package: { inherit (package) name; pname = package.pname or package.name; }))' > "$RUNNER_TEMP/packages.json"
          echo "matrix=$(python3 scripts/ci-packages.py "$RUNNER_TEMP/packages.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: ${{ toJSON(fromJSON(needs.check.outputs.matrix).include) != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-emulators
          # Never install upload hooks: binary packages and their FODs must stay local.
          skipPush: true
      - name: Build selected native packages
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
          CACHE_PACKAGES: ${{ toJSON(matrix.cache_packages) }}
          SYSTEM: ${{ matrix.system }}
        run: |
          : > "$RUNNER_TEMP/cache-paths"
          while IFS= read -r package; do
            nix --accept-flake-config build --no-link --log-lines 100 --json \
              ".#packages.$SYSTEM.$package" > "$RUNNER_TEMP/build.json"
            if jq -e --arg package "$package" 'index($package) != null' <<< "$CACHE_PACKAGES" > /dev/null; then
              jq -r '.[].outputs[]' "$RUNNER_TEMP/build.json" >> "$RUNNER_TEMP/cache-paths"
            fi
          done < <(jq -r '.[]' <<< "$PACKAGES")
      - name: Check launchers without a display
        env:
          PACKAGES: ${{ toJSON(matrix.packages) }}
        run: |
          if jq -e 'index("cemu-git") != null' <<< "$PACKAGES" > /dev/null; then
            nix --accept-flake-config run .#cemu-git -- --version
          fi
          if jq -e 'index("ryubing-git") != null' <<< "$PACKAGES" > /dev/null; then
            nix --accept-flake-config run .#ryubing-git -- --no-gui --version
          fi
      - name: Upload only source-built package outputs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -s "$RUNNER_TEMP/cache-paths" && -n "$CACHIX_AUTH_TOKEN" ]]; then
            cachix push nix-emulators < "$RUNNER_TEMP/cache-paths"
          fi
